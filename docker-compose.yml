services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      SOCIAL_APP_NAME: Mini Social Network
      SOCIAL_ENVIRONMENT: docker
      SOCIAL_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/social
      SOCIAL_REDIS_URL: redis://redis:6379/0
      SOCIAL_JWT_SECRET_KEY: ${SOCIAL_JWT_SECRET_KEY:-change-me-in-production}
      SOCIAL_JWT_ALGORITHM: HS256
      SOCIAL_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SOCIAL_VERIFICATION_TOKEN_EXPIRE_HOURS: 24
      SOCIAL_CLEANUP_UNVERIFIED_AFTER_HOURS: 48
      SOCIAL_MAINTENANCE_TOKEN: ${SOCIAL_MAINTENANCE_TOKEN:-local-maintenance-token}
      SOCIAL_LOGIN_RATE_LIMIT_ATTEMPTS: ${SOCIAL_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      SOCIAL_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${SOCIAL_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      SOCIAL_PUBLIC_BASE_URL: ${SOCIAL_PUBLIC_BASE_URL:-http://localhost:8010}
      SOCIAL_SMTP_HOST: ${SOCIAL_SMTP_HOST:-}
      SOCIAL_SMTP_PORT: ${SOCIAL_SMTP_PORT:-587}
      SOCIAL_SMTP_USERNAME: ${SOCIAL_SMTP_USERNAME:-}
      SOCIAL_SMTP_PASSWORD: ${SOCIAL_SMTP_PASSWORD:-}
      SOCIAL_SMTP_FROM_EMAIL: ${SOCIAL_SMTP_FROM_EMAIL:-}
      SOCIAL_SMTP_USE_TLS: ${SOCIAL_SMTP_USE_TLS:-true}
      SOCIAL_POST_TTL_DAYS: ${SOCIAL_POST_TTL_DAYS:-}
    ports:
      - "${SOCIAL_APP_PORT:-8010}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    environment:
      SOCIAL_APP_NAME: Mini Social Network
      SOCIAL_ENVIRONMENT: docker
      SOCIAL_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/social
      SOCIAL_REDIS_URL: redis://redis:6379/0
      SOCIAL_JWT_SECRET_KEY: ${SOCIAL_JWT_SECRET_KEY:-change-me-in-production}
      SOCIAL_JWT_ALGORITHM: HS256
      SOCIAL_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SOCIAL_VERIFICATION_TOKEN_EXPIRE_HOURS: 24
      SOCIAL_CLEANUP_UNVERIFIED_AFTER_HOURS: 48
      SOCIAL_MAINTENANCE_TOKEN: ${SOCIAL_MAINTENANCE_TOKEN:-local-maintenance-token}
      SOCIAL_LOGIN_RATE_LIMIT_ATTEMPTS: ${SOCIAL_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      SOCIAL_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${SOCIAL_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      SOCIAL_PUBLIC_BASE_URL: ${SOCIAL_PUBLIC_BASE_URL:-http://localhost:8010}
      SOCIAL_SMTP_HOST: ${SOCIAL_SMTP_HOST:-}
      SOCIAL_SMTP_PORT: ${SOCIAL_SMTP_PORT:-587}
      SOCIAL_SMTP_USERNAME: ${SOCIAL_SMTP_USERNAME:-}
      SOCIAL_SMTP_PASSWORD: ${SOCIAL_SMTP_PASSWORD:-}
      SOCIAL_SMTP_FROM_EMAIL: ${SOCIAL_SMTP_FROM_EMAIL:-}
      SOCIAL_SMTP_USE_TLS: ${SOCIAL_SMTP_USE_TLS:-true}
      SOCIAL_POST_TTL_DAYS: ${SOCIAL_POST_TTL_DAYS:-}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      SOCIAL_APP_NAME: Mini Social Network
      SOCIAL_ENVIRONMENT: docker
      SOCIAL_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/social
      SOCIAL_REDIS_URL: redis://redis:6379/0
      SOCIAL_JWT_SECRET_KEY: ${SOCIAL_JWT_SECRET_KEY:-change-me-in-production}
      SOCIAL_JWT_ALGORITHM: HS256
      SOCIAL_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      SOCIAL_VERIFICATION_TOKEN_EXPIRE_HOURS: 24
      SOCIAL_CLEANUP_UNVERIFIED_AFTER_HOURS: 48
      SOCIAL_MAINTENANCE_TOKEN: ${SOCIAL_MAINTENANCE_TOKEN:-local-maintenance-token}
      SOCIAL_LOGIN_RATE_LIMIT_ATTEMPTS: ${SOCIAL_LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      SOCIAL_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${SOCIAL_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      SOCIAL_PUBLIC_BASE_URL: ${SOCIAL_PUBLIC_BASE_URL:-http://localhost:8010}
      SOCIAL_SMTP_HOST: ${SOCIAL_SMTP_HOST:-}
      SOCIAL_SMTP_PORT: ${SOCIAL_SMTP_PORT:-587}
      SOCIAL_SMTP_USERNAME: ${SOCIAL_SMTP_USERNAME:-}
      SOCIAL_SMTP_PASSWORD: ${SOCIAL_SMTP_PASSWORD:-}
      SOCIAL_SMTP_FROM_EMAIL: ${SOCIAL_SMTP_FROM_EMAIL:-}
      SOCIAL_SMTP_USE_TLS: ${SOCIAL_SMTP_USE_TLS:-true}
      SOCIAL_POST_TTL_DAYS: ${SOCIAL_POST_TTL_DAYS:-}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
